<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Hitster - Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="gameCard">

    <button id="backButton">
        ← Back to Menu
    </button>

    <h2>My Account</h2>

    <!-- LOGIN -->

    <div id="loginSection">

        <h3>Log In</h3>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
            autocomplete="email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button id="loginButton">
            Log In
        </button>

        <p id="loginMessage"></p>

        <hr>

        <h3>Create Account</h3>

        <input
            type="email"
            id="signupEmail"
            placeholder="Email"
            autocomplete="email"
        >

        <input
            type="password"
            id="signupPassword"
            placeholder="Password"
            autocomplete="new-password"
        >

        <button id="signupButton">
            Create Account
        </button>

        <p id="signupMessage"></p>

    </div>


    <!-- LOGGED IN -->

    <div id="accountSection" style="display:none;">

        <h3>You're logged in!</h3>

        <p>
            <strong>Email:</strong>
            <span id="accountEmail"></span>
        </p>

        <button id="logoutButton">
            Log Out
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/account.js"></script>

</body>

</html>
