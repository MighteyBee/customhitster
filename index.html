<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Hitster</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="gameCard menuCard">

<h1>My Hitster</h1>

<div class="profileBox">

    <div class="profileUsername">
        Loading...
    </div>

    <div class="profilePoints">
        0
    </div>

    <div class="pointsLabel">
        Points
    </div>

</div>

 <button id="accountButton">
        Account
    </button>


<button id="shuffleButton">
 Song Guesser
</button>
 <button id="heardleButton">
 Heardle
</button>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/profile.js"></script>
<script>
 document.addEventListener("DOMContentLoaded", async () => {
            // Ensure Supabase is initialized
            if (typeof window.supabase !== 'undefined') {
                await loadProfile();
            } else {
                console.error("Supabase client not initialized!");
                document.querySelector(".profileUsername").textContent = "Guest";
            }

            // Set up button event listeners
            document.getElementById("accountButton").addEventListener("click", () => {
                window.location.href = "login.html";
            });

            fetch("data/songs.json")
                .then(response => response.json())
                .then(songs => {
                    const ids = Object.keys(songs);

                    document.getElementById("shuffleButton").addEventListener("click", () => {
                        const randomId = ids[Math.floor(Math.random() * ids.length)];
                        window.location.href = "player.html";
                    });

                    document.getElementById("heardleButton").addEventListener("click", () => {
                        const randomId = ids[Math.floor(Math.random() * ids.length)];
                        window.location.href = "heardle.html";
                    });
                });
        });
    </script>
</body>
</html>
