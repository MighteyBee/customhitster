<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Hitster</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="gameCard menuCard">

<h1>My Hitster</h1>

 <button id="accountButton">
        Account
    </button>


<button id="shuffleButton">
 Song Guesser
</button>
 <button id="heardleButton">
 Heardle
</button>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>

document.getElementById("accountButton").addEventListener("click", () => {
    window.location.href = "account.html";
});

fetch("data/songs.json")
.then(response => response.json())
.then(songs => {

    const ids = Object.keys(songs);

    document.getElementById("shuffleButton").addEventListener("click", () => {

        const randomId = ids[Math.floor(Math.random() * ids.length)];

        window.location.href = "player.html";
    });

                document.getElementById("heardleButton").addEventListener("click", () => {
                    const randomId = ids[Math.floor(Math.random() * ids.length)];
                    window.location.href = "heardle.html";
                });
            });
    </script>

</body>
</html>
