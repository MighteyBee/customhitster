<!DOCTYPE html>
<html>

<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Hitster</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="gameCard">
    <button id="backButton">
    ← Back to Menu
</button>
    <h2> Guess the Song!</h2>
         <div class="decadeButtons">

<button class="decadeButton" data-decade="all">
All
</button>

<button class="decadeButton" data-decade="60s">
60s
</button>

<button class="decadeButton" data-decade="70s">
70s
</button>

<button class="decadeButton" data-decade="80s">
80s
</button>

<button class="decadeButton" data-decade="90s">
90s
</button>

<button class="decadeButton" data-decade="2000s">
2000s
</button>

</div>
    <audio id="player"></audio>

    <div class="playerButtons">

        <button id="playButton">▶ Play</button>
        <button id="pauseButton">⏸ Pause</button>

    </div>

    <progress id="progress" value="0" max="100"></progress>

<div id="scoreBox">
    <h3>Score: <span id="score">0</span></h3>
</div>

<div style="position: relative;">
    <label for="artistGuess">Artist Guess</label>
    <input type="text" id="artistGuess" placeholder="Type the artist..." autocomplete="off">
    <div id="autocompleteArtistList" class="autocomplete-items"></div>
</div>

<div style="position: relative;">
    <label for="songGuess">Song Title Guess</label>
    <input type="text" id="songGuess" placeholder="Type the song title..." autocomplete="off">
    <div id="autocompleteSongList" class="autocomplete-items"></div>
</div>

    <button id="revealButton">
         Reveal Song
    </button>

    <button id="shuffleButton">
         Shuffle
    </button>

    <div id="songInfo">

        <h3 id="title"></h3>

        <p id="artist"></p>

        <p id="year"></p>

    </div>

    
</div>
<script src="js/songs.js"></script>
<script src="js/ui.js"></script>
<script src="js/script.js"></script>
</body>

</html>
