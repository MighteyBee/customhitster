<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Hitster</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="gameCard">

    <!-- Back Button -->
    <button id="backButton">
        ← Back to Menu
    </button>

    <h2>Guess the Song!</h2>


    <!-- =========================
         GAME SETTINGS
    ========================== -->

    <div class="gameSettings">

        <div class="setting">
            <label for="decadeSelect">
                Decade
            </label>

            <select id="decadeSelect">
                <option value="all">All</option>
                <option value="60s">60s</option>
                <option value="70s">70s</option>
                <option value="80s">80s</option>
                <option value="90s">90s</option>
                <option value="2000s">2000s</option>
            </select>
        </div>


        <div class="setting">
            <label for="modeSelect">
                Game Mode
            </label>

            <select id="modeSelect">
                <option value="6">Best of 6 (x1.1)</option>
                <option value="10">Best of 10 (x2)</option>
                <option value="15">Best of 15 (x2.5)</option>
                <option value="endless">Endless</option>
            </select>
        </div>

    </div>


    <!-- Round Information -->

    <div id="roundInfo">
        Round
        <span id="currentRound">1</span>
        /
        <span id="totalRounds">6</span>
    </div>


    <!-- =========================
         AUDIO PLAYER
    ========================== -->

    <audio id="player"></audio>


    <div class="playerButtons">

        <button id="playButton">
            ▶ Play
        </button>

        <button id="pauseButton">
            ⏸ Pause
        </button>

    </div>


    <progress
        id="progress"
        value="0"
        max="100">
    </progress>


    <!-- =========================
         SCORE
    ========================== -->

    <div id="scoreBox">

        <h3>
            Score:
            <span id="score">0</span>
        </h3>

    </div>


    <!-- =========================
         REVEAL / NEXT
    ========================== -->

    <div class="topControls">

        <button id="revealButton">
            Reveal Song
        </button>

        <button id="shuffleButton">
            Next Song
        </button>

    </div>


    <!-- =========================
         ARTIST GUESS
    ========================== -->

    <div class="guessField">

        <label for="artistGuess">
            Artist Guess
        </label>

        <div class="autocompleteWrapper">

            <input
                type="text"
                id="artistGuess"
                placeholder="Type the artist..."
                autocomplete="off"
            >

            <div
                id="autocompleteArtistList"
                class="autocomplete-items">
            </div>

        </div>

    </div>


    <!-- =========================
         SONG GUESS
    ========================== -->

    <div class="guessField">

        <label for="songGuess">
            Song Title Guess
        </label>

        <div class="autocompleteWrapper">

            <input
                type="text"
                id="songGuess"
                placeholder="Type the song title..."
                autocomplete="off"
            >

            <div
                id="autocompleteSongList"
                class="autocomplete-items">
            </div>

        </div>

    </div>


    <!-- =========================
         SONG INFORMATION
    ========================== -->

    <div id="songInfo">

        <h3 id="title"></h3>

        <p id="artist"></p>

        <p id="year"></p>

    </div>


    <!-- =========================
         MINI PROFILE
    ========================== -->

    <div class="miniProfile">

        <span class="profileUsername">
            Loading...
        </span>

        <span class="miniProfileDivider">
            •
        </span>

        <span class="profilePoints">
            0
        </span>

        <span>
            Points
        </span>

    </div>

</div>


<!-- =========================
     SCRIPTS
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>
<script src="js/points.js"></script>
<script src="js/profile.js"></script>
<script src="js/songs.js"></script>
<script src="js/ui.js"></script>
<script src="js/script.js"></script>

</body>
</html>
