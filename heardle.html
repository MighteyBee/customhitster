<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Heardle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gameCard">
    <button id="backButton">
        ← Back to Menu
    </button>


        <h2>My Heardle</h2>
        <div class="decadeButtons">

<button class="decadeButton" data-decade="all">
All
</button>

<button class="decadeButton" data-decade="60s">
60s
</button>

<button class="decadeButton" data-decade="70s">
70s
</button>

<button class="decadeButton" data-decade="80s">
80s
</button>

<button class="decadeButton" data-decade="90s">
90s
</button>

<button class="decadeButton" data-decade="2000s">
2000s
</button>

</div>
        <audio id="player"></audio>

        



<div class="buttonGroup topControls">

    <button id="playButton">
        ▶ Play
    </button>

    <button id="shuffleButton">
        Shuffle
    </button>

</div>
        <div class="heardleTries">
            <div class="try" id="try1">
                <progress id="progress1" value="0" max="1"></progress>
                <div class="guessResult" id="guessResult1"></div>
            </div>
            <div class="try" id="try2">
                <progress id="progress2" value="0" max="2"></progress>
                <div class="guessResult" id="guessResult2"></div>
            </div>
            <div class="try" id="try3">
                <progress id="progress3" value="0" max="5"></progress>
                <div class="guessResult" id="guessResult3"></div>
            </div>
            <div class="try" id="try4">
                <progress id="progress4" value="0" max="5"></progress>
                <div class="guessResult" id="guessResult4"></div>
            </div>
            <div class="try" id="try5">
                <progress id="progress5" value="0" max="5"></progress>
                <div class="guessResult" id="guessResult5"></div>
            </div>
            <div class="try" id="try6">
                <progress id="progress6" value="0" max="100"></progress>
                <div class="guessResult" id="guessResult6"></div>
            </div>
        </div>

        <div style="position: relative;">
            <label for="artistGuess">Artist Guess</label>
            <input type="text" id="artistGuess" placeholder="Type the artist..." autocomplete="off">
            <div id="autocompleteArtistList" class="autocomplete-items"></div>
        </div>

        <div style="position: relative;">
            <label for="songGuess">Song Title Guess</label>
            <input type="text" id="songGuess" placeholder="Type the song title..." autocomplete="off">
            <div id="autocompleteSongList" class="autocomplete-items"></div>
        </div>

     <div class="buttonGroup">

    <button id="submitButton">
        Submit
    </button>

    <button id="skipButton">
        ⏭ Skip
    </button>

</div>

        <div id="songInfo">
            <h3 id="title"></h3>
            <p id="artist"></p>
        </div>
    </div>
    <script src="js/songs.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/heardle.js"></script>
</body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

</html>
