<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Heardle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gameCard">
        <h2>My Heardle</h2>

        <audio id="player"></audio>

        <button id="playButton">▶ Play</button>
        <button id="skipButton">⏭ Skip</button>
        <button id="shuffleButton">Shuffle</button>


        <div class="heardleTries">
            <div class="try" id="try1">
                <progress id="progress1" value="0" max="1"></progress>
                <div class="guessInput">
                    <input type="text" id="artistGuess1" placeholder="Artist..." autocomplete="off">
                    <input type="text" id="songGuess1" placeholder="Song..." autocomplete="off">
                    <div id="autocompleteArtistList1" class="autocomplete-items"></div>
                    <div id="autocompleteSongList1" class="autocomplete-items"></div>
                </div>
            </div>
            <div class="try" id="try2">
                <progress id="progress2" value="0" max="2"></progress>
                <div class="guessInput">
                    <input type="text" id="artistGuess2" placeholder="Artist..." autocomplete="off">
                    <input type="text" id="songGuess2" placeholder="Song..." autocomplete="off">
                    <div id="autocompleteArtistList2" class="autocomplete-items"></div>
                    <div id="autocompleteSongList2" class="autocomplete-items"></div>
                </div>
            </div>
            <div class="try" id="try3">
                <progress id="progress3" value="0" max="5"></progress>
                <div class="guessInput">
                    <input type="text" id="artistGuess3" placeholder="Artist..." autocomplete="off">
                    <input type="text" id="songGuess3" placeholder="Song..." autocomplete="off">
                    <div id="autocompleteArtistList3" class="autocomplete-items"></div>
                    <div id="autocompleteSongList3" class="autocomplete-items"></div>
                </div>
            </div>
            <div class="try" id="try4">
                <progress id="progress4" value="0" max="5"></progress>
                <div class="guessInput">
                    <input type="text" id="artistGuess4" placeholder="Artist..." autocomplete="off">
                    <input type="text" id="songGuess4" placeholder="Song..." autocomplete="off">
                    <div id="autocompleteArtistList4" class="autocomplete-items"></div>
                    <div id="autocompleteSongList4" class="autocomplete-items"></div>
                </div>
            </div>
            <div class="try" id="try5">
                <progress id="progress5" value="0" max="5"></progress>
                <div class="guessInput">
                    <input type="text" id="artistGuess5" placeholder="Artist..." autocomplete="off">
                    <input type="text" id="songGuess5" placeholder="Song..." autocomplete="off">
                    <div id="autocompleteArtistList5" class="autocomplete-items"></div>
                    <div id="autocompleteSongList5" class="autocomplete-items"></div>
                </div>
            </div>
            <div class="try" id="try6">
                <progress id="progress6" value="0" max="100"></progress>
                <div class="guessInput">
                    <input type="text" id="artistGuess6" placeholder="Artist..." autocomplete="off">
                    <input type="text" id="songGuess6" placeholder="Song..." autocomplete="off">
                    <div id="autocompleteArtistList6" class="autocomplete-items"></div>
                    <div id="autocompleteSongList6" class="autocomplete-items"></div>
                </div>
            </div>
        </div>

        
        <div id="songInfo">
            <h3 id="title"></h3>
            <p id="artist"></p>
        </div>
    </div>

    <script src="heardle.js"></script>
</body>
</html>
